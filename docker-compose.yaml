services:
  redis:
    image: redis:7.4.1
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  model-server:
    build:
      context: ./model-server
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
      - MODEL_NAME=mambaout_base.in1k
    ports:
      - "8000:80"
    depends_on:
      redis:
        condition: service_healthy

  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
      - MODEL_SERVER_URL=http://model-server
    ports:
      - "9000:80"
    depends_on:
      - model-server